# CI for OpenSVR.
#
# Why a plain matrix instead of `cargo dist`: releases stay manual (no tags
# are cut by automation and nothing publishes), so there is no release
# pipeline to drive; `cargo dist` would add installers plus a config to
# maintain for no current gain. Revisit it when publishing GitHub Releases
# becomes routine. This workflow tests, lints, checks formatting, and
# uploads binaries.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --check
      - name: Build release binaries
        run: cargo build --release --locked -p opensvr-cli
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensvr-${{ matrix.os }}
          path: |
            target/release/opensvr
            target/release/opensvr.exe
            crates/opensvr-cli/opensvr.1
